.workshop-content .alhamd-new-mark img{mix-blend-mode:screen!important;-webkit-mask-image:radial-gradient(ellipse 74% 78% at 50% 50%,#000 50%,rgba(0,0,0,.93) 66%,transparent 100%);mask-image:radial-gradient(ellipse 74% 78% at 50% 50%,#000 50%,rgba(0,0,0,.93) 66%,transparent 100%);filter:drop-shadow(0 1px 2px rgba(0,0,0,.2))!important}

/* Refined mobile navigation: slim, lifted rail with consistent line icons */
.workspace>nav .nav-symbol{display:inline-flex!important;align-items:center!important;justify-content:center!important}
.workspace>nav .nav-symbol svg{display:block;width:21px;height:21px;flex-shrink:0}
@media(max-width:850px){
 .workspace{grid-template-columns:46px minmax(0,1fr)!important}
 .workspace>nav{width:46px!important;padding:4px 3px!important;gap:2px!important;align-items:center!important;background:linear-gradient(180deg,#071c30,#0a2840)!important}
 .workspace>nav button{width:39px!important;min-height:40px!important;height:40px!important;border-radius:11px!important;padding:6px!important;margin:0!important}
 .workspace>nav .nav-symbol svg{width:20px;height:20px}
 .workspace>nav button.active{background:linear-gradient(145deg,#f1d18d,#c89b51)!important;box-shadow:0 2px 8px #0003!important}
 .workspace>main{padding:7px!important}
 body.drawer-open .workspace>nav{width:min(78vw,290px)!important;align-items:stretch!important;padding:18px 10px!important;gap:5px!important}
 body.drawer-open .workspace>nav button{width:100%!important;min-height:46px!important;height:auto!important;justify-content:flex-start!important;padding:10px 12px!important}
}
@media(max-width:420px){.workspace{grid-template-columns:44px minmax(0,1fr)!important}.workspace>nav{width:44px!important;padding:4px 2px!important}.workspace>nav button{width:38px!important}}

'use strict';

const INVOICE_DEFAULTS={company:'الحمد',subtitle:'لاستيراد وتجارة معدات النجارة',english:'ALHAMD · WOODWORKING MACHINERY',phone1:'01500070661',phone2:'01555502800',phone3:'01004670661',address:'المنصورة – دكرنس – القباب الصغرى\nبجوار معرض مكة للسيراميك',invoiceTitle:'فاتورة بيع',notes:'يتم إثبات تسليم الماكينات حسب حالة الصفقة المسجلة.\nيُرجى الاحتفاظ بالفاتورة للرجوع إليها.\nهذه الفاتورة صادرة من شركة الحمد.',clientSign:'توقيع العميل',companySign:'توقيع الشركة',stamp:'ختم الشركة',footer:'الحمد لاستيراد وتجارة معدات النجارة',motto:'ثقتكم أساس نجاحنا',brands:'SCM, BIESSE, HOMAG, ALTENDORF, FELDER, WEINIG, HOLZ-HER, FORMAT 4, SICAR, MAGGI, IMA, VITAP, Brandt, CEHISA, CASADEI, griggio, OMAL, Giben',showBrands:true,showNotes:true,showStamp:true,showMachineImages:true,logo:''};

wInvoice" class="gold">معاينة الفاتورة</button></div>${db.deals.length?'':'<p class="hint">تظهر المعاينة بعد تسجيل أول صفقة، دون الحاجة لعمل بيانات تجريبية.</p>'}</div>`}

function field(k,l,type='text',attrs='',wide=false){return `<div class="${wide?'wide':''}"><label>${l}</label><input name="${k}" type="${type}" ${attrs} required></div>`}
function optional(k,l,type='text',attrs=''){return `<div><label>${l}</label><input name="${k}" type="${type}" ${attrs}></div>`}
function pick(k,l,arr,placeholder='اختر'){return `<div><label>${l}</label><select name="${k}" required><option value="">${placeholder}</option>${arr.map(o=>`<option value="${esc(o.id)}">${esc(o.label||o.name)}</option>`).join('')}</select></div>`}
function noteChoice(k,l,options){return `<div><label>${l}</label><select name="${k}" required>${options.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`}
const supplierNotes=['دفعة من الحساب','مقدم للمورد','سداد جزء من ماكينة','سداد كامل','أخرى'];

function form(action,html){return `<form data-action="${action}">${html}<div class="wide"><button class="gold" type="submit">حفظ العملية</button></div></form>`}
function grid(items){return `<div class="grid">${items.map(([k,v])=>`<div class="metric">${k}<b>${v}</b></div>`).join('')}</div>`}
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>{let i=0;return row.replace(/<td(\\s[^>]*)?>/g,(tag,attrs='')=>`<td${attrs} data-label="${esc(headers[i++]||'')}">`)}).join(''):`<tr><td colspan="${headers.length}" class="empty">لا توجد بيانات بعد</td></tr>`}</tbody></table></div>`}
function tr(vals){return `<tr>${vals.map(v=>`<td>${v}</td>`).join('')}</tr>`}
function btn(label,act,id,style='small'){return `<button class="${style}" data-do="${act}" data-id="${esc(id)}">${label}</button>`}
function machineCost(m){return num(m.cost)+sum(db.expenses.filter(e=>e.machineId===m.id),e=>e.amount)}
function dealMachines(d){return db.machines.filter(m=>m.dealId===d.id)}
function total(d){return sum(dealMachines(d),m=>m.sale)}
function paid(d){return sum(db.receipts.filter(r=>r.dealId===d.id),r=>r.amount)}
function deliverable(d){return paid(d)-sum(dealMachines(d).filter(m=>m.delivered),m=>m.sale)}
function loanBalance(l){return sum(db.loanMoves.filter(m=>m.loanId===l.id),m=>m.type==='give'?m.amount:-m.amount)}
function loanCash(){return sum(db.loanMoves,m=>{let l=db.loans.find(x=>x.id===m.loanId);if(!l)return 0;return (l.direction==='out'?-1:1)*(m.type==='give'?m.amount:-m.amount)})}
function supplierBalance(s){return sum(db.machines.filter(m=>m.supplierId===s.id),m=>m.cost)-sum(db.supplierPayments.filter(p=>p.supplierId===s.id),p=>p.amount)}

function validMoney(f){return Number.isFinite(Number(f.amount))&&Number(f.amount)>0}
function submit(action,f){if(action==='invoiceSettings'){for(const k of Object.keys(INVOICE_DEFAULTS)){if(k==='logo')continue;invoiceSettings[k]=typeof INVOICE_DEFAULTS[k]==='boolean'?f[k]==='on':String(f[k]??'').trim()}saveInvoiceSettings();render();alert('تم حفظ إعدادات الفاتورة بنجاح');return}
if(action==='supplier'){if(db.suppliers.some(s=>s.name===f.name.trim()))return alert('المورد موجود بالفعل');db.suppliers.push({id:uid(),name:f.name.trim(),phone:f.phone||''})}
else if(action==='machine'){if(!db.suppliers.some(s=>s.id===f.supplierId))return alert('اختر موردًا');if(db.machines.some(m=>m.code.trim().toLowerCase()===f.code.trim().toLowerCase()))return alert('كود الماكينة موجود بالفعل');db.machines.push({...f,id:uid(),code:f.code.trim(),name:f.name.trim(),cost:num(f.cost),sale:0,dealId:null,delivered:false})}
else if(action==='supplierPayment'){if(!validMoney(f))return alert('أدخل مبلغًا صحيحًا');db.supplierPayments.push({...f,id:uid(),amount:num(f.amount)})}
else if(action==='loanPerson'){if(!f.name.trim())return alert('اكتب اسم الشخص');db.loans.push({id:uid(),name:f.name.trim(),direction:f.direction})}
 else if(action==='loanMove'){if(!db.loans.some(l=>l.id===f.loanId)||!validMoney(f))return alert('راجع البيانات');if(f.type==='return'&&num(f.amount)>loanBalance(db.loans.find(l=>l.id===f.loanId))+.00001)return alert('السداد أكبر من الرصيد');db.loanMoves.push({...f,id:uid(),amount:num(f.amount)})}
 else if(action==='customer'){if(db.customers.some(c=>c.name===f.name.trim()))return alert('العميل موجود بالفعل');db.customers.push({id:uid(),code:'C'+String(db.customers.length+1).padStart(3,'0'),name:f.name.trim(),phone:f.phone||''})}
else if(action==='deal'){if(!db.customers.some(c=>c.id===f.customerId))return alert('اختر عميلًا');db.deals.push({...f,id:uid(),code:'S'+String(db.deals.length+1).padStart(3,'0')})}
else if(action==='assign'){let m=db.machines.find(m=>m.id===f.machineId),d=db.deals.find(d=>d.id===f.dealId);if(!m||m.dealId||!d||num(f.sale)<=0)return alert('تأكد من الصفقة والماكينة والسعر');m.dealId=d.id;m.sale=num(f.sale)}
else if(action==='receipt'){let d=db.deals.find(d=>d.id===f.dealId);if(!d||!validMoney(f)||num(f.amount)>total(d)-paid(d)+.00001)return alert('الدفعة أكبر من المتبقي أو غير صحيحة');db.receipts.push({...f,id:uid(),amount:num(f.amount)})}
else if(['expense','withdrawal','cashMove'].includes(action)){if(!validMoney(f))return alert('أدخل مبلغًا صحيحًا');db[action==='expense'?'expenses':action==='withdrawal'?'withdrawals':'cashMoves'].push({...f,id:uid(),amount:num(f.amount)})}
persist()}

if(a==='deliver'){let m=db.machines.find(x=>x.id===id),d=db.deals.find(x=>x.id===m?.dealId);if(!m||!d||m.delivered)return;if(deliverable(d)+.00001<num(m.sale))return alert('لا يمكن التسليم: المدفوع لا يغطي سعر الماكينة بعد خصم ما تم تسليمه');if(confirm('تأكيد تسليم '+m.name+'؟')){m.delivered=true;m.deliveryDate=today();persist()}}

function printDocument(type,id,preview=false){const cfg=invoiceSettings;let d=db.deals.find(d=>d.id===id);if(!d)return;let html=head(type==='invoice'?(cfg.invoiceTitle||'فاتورة بيع'):type==='statement'?'كشف حساب':'إيصال استلام دفعة',d);
if(type==='invoice'){html+=`<div class="bill-items">`+table(['م','كود الماكينة','اسم الماكينة','الصورة','الكمية','سعر الوحدة','الإجمالي'],dealMachines(d).map((m,i)=>tr([i+1,esc(m.code),esc(m.name),(cfg.showMachineImages&&m.image)?'<img class="bill-machine-photo" src="'+esc(m.image)+'" alt="صورة الماكينة">':'—','1',cash(m.sale),cash(m.sale)])))+`</div><div class="bill-lower"><div class="bill-notes"><h3>ملاحظات</h3><p>• يتم إثبات تسليم الماكينات حسب حالة الصفقة المسجلة.</p><p>• يُرجى الاحتفاظ بالفاتورة للرجوع إليها.</p><p>• هذه الفاتورة صادرة من شركة الحمد.</p></div><div class="bill-totals"><p>إجمالي الفاتورة <b>${cash(total(d))}</b></p><p>المدفوع <b>${cash(paid(d))}</b></p><p class="bill-due">المتبقي <b>${cash(total(d)-paid(d))}</b></p></div></div>`}
if(type==='statement')html+=table(['التاريخ','العملية','المبلغ'],[tr([esc(d.date),'إجمالي الصفقة',cash(total(d))]),...db.receipts.filter(r=>r.dealId===d.id).map(r=>tr([esc(r.date),esc(r.note||'دفعة'),cash(r.amount)]))])+`<h3>المتبقي: ${cash(total(d)-paid(d))}</h3>`;
if(type==='receiptPrint'){let r=db.receipts.filter(r=>r.dealId===d.id).at(-1);if(!r)return alert('لا توجد دفعات للصفقة');html+=`<h2>استلمنا مبلغ: ${cash(r.amount)}</h2><p>بتاريخ: ${esc(r.date)}</p><p>إجمالي المدفوع: ${cash(paid(d))} — المتبقي: ${cash(total(d)-paid(d))}</p>`}
if(type==='invoice'&&cfg.showBrands)html+=`<div class="bill-brands"><strong>براندات عالمية نثق بها</strong><div class="bill-brand-grid">${cfg.brands.split(/[,،\n]+/).map(x=>x.trim()).filter(Boolean).map(x=>'<span>'+esc(x)+'</span>').join('')}</div></div>`;
html+=`<div class="bill-signatures"><div>${esc(cfg.clientSign)}<div class="bill-line"></div></div>${cfg.showStamp?`<div class="bill-stamp">${esc(cfg.stamp)}<br><small>مكان الختم</small></div>`:'<div></div>'}<div>${esc(cfg.companySign)}<div class="bill-line"></div></div></div><div class="bill-footer">${esc(cfg.footer)} <span>${esc(cfg.motto)}</span></div>`;
$('paper').innerHTML=(preview?'<div class="preview-toolbar"><button onclick="window.print()">طباعة الفاتورة</button><button onclick="closeInvoicePreview()">إغلاق المعاينة</button></div>':'')+`<div class="invoice bill">${html}</div>`;if(preview){$('paper').classList.add('preview-open');document.body.style.overflow='hidden'}else{window.print()}}

function closeInvoicePreview(){$('paper').classList.remove('preview-open');$('paper').innerHTML='';document.body.style.overflow=''}
try{render()}catch(err){console.error(err);document.getElementById('app').innerHTML='<div class="card"><h2>تعذر عرض الصفحة</h2><p>حدث خطأ أثناء تحميل الواجهة. بياناتك المحلية لم يتم حذفها. جرّب تحديث الصفحة.</p></div>'}
