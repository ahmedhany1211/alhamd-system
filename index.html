<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>الحمد | إدارة معدات النجارة</title><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta name="theme-color" content="#102b3d"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="الحمد"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><style>:root{--n:#102b3d;--g:#bd8d42;--bg:#f3f5f7}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:15px Tahoma,Arial;color:#172d39}header{background:var(--n);color:white;padding:20px;text-align:center;border-bottom:5px solid var(--g)}header h1{margin:0;color:#e6c386;font-size:32px}header p{margin:6px}nav{display:flex;gap:7px;overflow-x:auto;max-width:100%;background:white;padding:12px;position:sticky;top:0;z-index:2;box-shadow:0 2px 6px #0001}button{cursor:pointer;border:0;background:var(--n);color:white;border-radius:8px;padding:11px 14px;font:inherit}nav button{white-space:nowrap;flex-shrink:0}button:hover{opacity:.87}.gold{background:var(--g);color:#101b22}.danger{background:#a33434}.wrap{max-width:1150px;margin:auto;padding:18px}.panel{background:white;padding:18px;border-radius:13px;margin:12px 0;box-shadow:0 2px 10px #0001}h2{margin:0 0 14px}form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;align-items:end}label{display:block;font-size:13px;margin-bottom:5px;font-weight:bold}input,select{width:100%;padding:11px;border:1px solid #ccd3d8;border-radius:8px;background:white;font:inherit}input[type=file]{max-width:230px}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}.stat{background:#f3f6f8;border-right:4px solid var(--g);padding:16px;border-radius:9px}.stat b{display:block;font-size:21px;margin-top:8px}table{width:100%;border-collapse:collapse;min-width:650px}th{background:var(--n);color:white}td,th{padding:10px;border:1px solid #d9e0e5;text-align:right}tr:nth-child(even){background:#f8fafb}.scroll{overflow:auto}.muted{color:#637581;font-size:13px}.hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap}.notice{background:#fff7e5;border:1px solid #e4c887;border-radius:8px;padding:12px;margin:10px 0}#printArea{display:none}@media print{body>*:not(#printArea){display:none!important}#printArea{display:block!important;background:white;color:#111;padding:0} @page{size:A4 portrait;margin:12mm}}.invoice{font:13px Tahoma,Arial;direction:rtl}.invoice .head{text-align:center;border:3px solid #b68b45;padding:14px;color:#102b3d}.invoice .head h1{font-size:33px;margin:0}.invoice table{min-width:0}.invoice td,.invoice th{border:1px solid #aebbc4;padding:9px}.invoice .sign{display:flex;justify-content:space-between;margin-top:65px}</style></head><body><header><h1>⚙ الحمد</h1><p>لاستيراد وتجارة معدات النجارة | م. أحمد هاني</p><small>المنصورة – دكرنس – القباب الصغرى – بجوار معرض مكة للسيراميك</small></header><nav id="nav"></nav><main class="wrap"><div class="notice">نسخة تجريبية محلية: البيانات تُحفظ في المتصفح الحالي فقط، وليست متزامنة بين الأجهزة. صدّر نسخة احتياطية بانتظام ولا تعتمد عليها وحدها لحساباتك النهائية.</div><section id="view"></section></main><div id="printArea"></div><script>
const KEY='alhamd-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))}catch{}db=db||{suppliers:['عباس الصياد','حماده أبو يوسف','مورد 3'],machines:[],supplierPayments:[],customers:[],deals:[],receipts:[],expenses:[],withdrawals:[]};let tab='الرئيسية';const money=n=>(+n||0).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م',sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0),id=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),save=()=>{localStorage.setItem(KEY,JSON.stringify(db));render()},field=(name,label,type='text',extra='')=>`<div><label>${label}</label><input name="${name}" type="${type}" ${extra} required></div>`,select=(name,label,values)=>`<div><label>${label}</label><select name="${name}" required>${values.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>`,date=()=>field('date','التاريخ','date',`value="${today()}"`),table=(headers,rows)=>`<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')||`<tr><td colspan="${headers.length}">لا توجد بيانات بعد</td></tr>`}</tbody></table></div>`,tr=values=>`<tr>${values.map(v=>`<td>${v}</td>`).join('')}</tr>`,form=(action,contents)=>`<form onsubmit="submitData(event,'${action}')">${contents}<button class="gold">حفظ العملية</button></form>`,num=x=>+x||0;
function purchaseGroups(supplier){const groups={};db.machines.filter(m=>m.supplier===supplier).forEach(m=>{let g=groups[m.batch]||(groups[m.batch]={batch:m.batch,date:m.date,total:0,items:[]});g.total+=num(m.cost);g.items.push(m)});return Object.values(groups).sort((a,b)=>a.date.localeCompare(b.date))}function supplierBalance(s){return sum(db.machines.filter(m=>m.supplier===s),m=>m.cost)-sum(db.supplierPayments.filter(p=>p.supplier===s),p=>p.amount)}function dealTotal(d){return sum(db.machines.filter(m=>m.deal===d.id),m=>m.sale)}function dealPaid(d){return sum(db.receipts.filter(r=>r.deal===d.id),r=>r.amount)}function availableDelivery(d){return dealPaid(d)-sum(db.machines.filter(m=>m.deal===d.id&&m.delivered),m=>m.sale)}function nav(){document.getElementById('nav').innerHTML=['الرئيسية','الماكينات',...db.suppliers,'العملاء','المصاريف والخزنة','النسخ الاحتياطي'].map(x=>`<button class="${x===tab?'gold':''}" data-tab="${esc(x)}">${esc(x)}</button>`).join('')}
document.getElementById('nav').addEventListener('click',function(event){const button=event.target.closest('button[data-tab]');if(!button)return;tab=button.getAttribute('data-tab');render();});
function render(){nav();let html='';if(tab==='الرئيسية'){const stock=db.machines.filter(m=>!m.delivered),revenue=sum(db.receipts,r=>r.amount),paidSup=sum(db.supplierPayments,p=>p.amount),exp=sum(db.expenses,e=>e.amount),wd=sum(db.withdrawals,w=>w.amount),due=sum(db.deals,d=>dealTotal(d)-dealPaid(d));html=`<div class="panel"><h2>لوحة التحكم</h2><div class="stats">${[['الماكينات غير المسلمة',stock.length],['تكلفة المخزون غير المسلم',money(sum(stock,m=>m.cost))],['المقبوض من العملاء',money(revenue)],['مدفوع للموردين',money(paidSup)],['المتبقي على العملاء',money(due)],['المصاريف',money(exp)],['المسحوبات الشخصية',money(wd)],['صافي الحركة النقدية المسجلة',money(revenue-paidSup-exp-wd)]].map(([k,v])=>`<div class="stat">${k}<b>${v}</b></div>`).join('')}</div><p class="muted">صافي الحركة النقدية لا يشمل رصيد افتتاحي أو تمويلًا غير مسجل، وليس صافي الربح.</p></div>`}else if(tab==='الماكينات'){html=`<div class="panel"><h2>إضافة ماكينة</h2><p class="muted">كرر نفس رقم الشحنة للماكينات المشتراة معًا؛ يجمع البرنامج سعر شرائها في عملية واحدة للمورد.</p>${form('machine',date()+field('name','اسم الماكينة')+field('code','كود الماكينة')+select('supplier','المورد',db.suppliers)+field('batch','رقم عملية الشراء / الشحنة')+field('cost','سعر الشراء','number','min="0" step="0.01"'))}</div><div class="panel"><h2>الماكينات</h2>${table(['الكود','الماكينة','المورد','الشحنة','الشراء','البيع','الحالة'],db.machines.map(m=>tr([esc(m.code),esc(m.name),esc(m.supplier),esc(m.batch),money(m.cost),m.deal?money(m.sale):'—',m.delivered?'تم التسليم':m.deal?'محجوزة':'متاحة'])))}</div>`}else if(db.suppliers.includes(tab)){let s=tab,groups=purchaseGroups(s),pays=db.supplierPayments.filter(p=>p.supplier===s),balance=supplierBalance(s);html=`<div class="panel"><h2>حساب المورد: ${esc(s)}</h2><div class="stats"><div class="stat">المشتريات<b>${money(sum(groups,g=>g.total))}</b></div><div class="stat">المدفوعات والمقدمات<b>${money(sum(pays,p=>p.amount))}</b></div><div class="stat">${balance>=0?'المطلوب للمورد':'رصيد مقدم عند المورد'}<b>${money(Math.abs(balance))}</b></div></div></div><div class="panel"><h2>تسجيل دفعة أو مقدم</h2>${form('supplierPayment',`<input type="hidden" name="supplier" value="${esc(s)}">`+date()+field('amount','المبلغ','number','min="0.01" step="0.01"')+field('note','البيان / رقم العملية','text','value="دفعة للمورد"'))}</div><div class="panel"><h2>عمليات الشراء المستقلة</h2>${table(['الشحنة','التاريخ','عدد الماكينات','إجمالي الشراء'],groups.map(g=>tr([esc(g.batch),esc(g.date),g.items.length,money(g.total)])))}</div><div class="panel"><h2>الدفعات والمقدمات</h2>${table(['التاريخ','البيان','المبلغ'],pays.map(p=>tr([esc(p.date),esc(p.note),money(p.amount)])))}</div><div class="notice">دفعات المورد حاليًا تُخصم من رصيده الإجمالي، ولا تُوزّع تلقائيًا على شحنة بعينها.</div>`}else if(tab==='العملاء'){html=`<div class="panel"><h2>إضافة عميل</h2>${form('customer',field('name','اسم العميل')+field('phone','رقم الهاتف','tel'))}</div><div class="panel"><h2>إنشاء صفقة بيع</h2>${form('deal',date()+select('customer','العميل',db.customers.map(c=>c.name))+field('note','بيان الصفقة'))}</div><div class="panel"><h2>إضافة ماكينة إلى صفقة</h2>${form('assign',select('deal','الصفقة',db.deals.map(d=>d.id+' | '+d.customer))+select('machine','الماكينة المتاحة',db.machines.filter(m=>!m.deal).map(m=>m.code+' | '+m.name))+field('sale','سعر البيع','number','min="0.01" step="0.01"'))}</div><div class="panel"><h2>تسجيل دفعة من عميل</h2>${form('receipt',date()+select('deal','الصفقة',db.deals.map(d=>d.id+' | '+d.customer))+field('amount','المبلغ','number','min="0.01" step="0.01"'))}</div><div class="panel"><h2>الصفقات والفواتير</h2>${table(['الصفقة','العميل','الإجمالي','المدفوع','المتبقي','إجراءات'],db.deals.map(d=>tr([esc(d.id),esc(d.customer),money(dealTotal(d)),money(dealPaid(d)),money(dealTotal(d)-dealPaid(d)),`<div class="actions"><button onclick="invoice('${d.id}')">طباعة فاتورة</button><button onclick="statement('${d.id}')">كشف حساب</button><button onclick="receiptPrint('${d.id}')">إيصال دفعة</button></div>`])))}</div><div class="panel"><h2>تسليم ماكينة</h2>${db.deals.map(d=>`<h3>${esc(d.customer)} — ${esc(d.id)} | المتاح للتسليم: ${money(availableDelivery(d))}</h3>${table(['الماكينة','سعر البيع','الحالة','الإجراء'],db.machines.filter(m=>m.deal===d.id).map(m=>tr([esc(m.name),money(m.sale),m.delivered?'تم التسليم':'لم تسلم',m.delivered?'—':`<button onclick="deliver('${m.id}')" ${availableDelivery(d)<num(m.sale)?'disabled style="opacity:.4"':''}>تسليم</button>`])))}`).join('')}</div>`}else if(tab==='المصاريف والخزنة'){html=`<div class="panel"><h2>تسجيل مصروف</h2>${form('expense',date()+field('note','البيان')+field('amount','المبلغ','number','min="0.01" step="0.01"')+select('machine','الماكينة (اختياري)',['بدون ماكينة',...db.machines.map(m=>m.code+' | '+m.name)]))}</div><div class="panel"><h2>مسحوبات شخصية / مصاريف البيت</h2>${form('withdrawal',date()+field('note','البيان')+field('amount','المبلغ','number','min="0.01" step="0.01"'))}</div><div class="panel"><h2>المصاريف</h2>${table(['التاريخ','البيان','الماكينة','المبلغ'],db.expenses.map(e=>tr([esc(e.date),esc(e.note),esc(e.machine),money(e.amount)])))}</div><div class="panel"><h2>المسحوبات</h2>${table(['التاريخ','البيان','المبلغ'],db.withdrawals.map(e=>tr([esc(e.date),esc(e.note),money(e.amount)])))}</div>`}else{html=`<div class="panel"><h2>نسخة احتياطية</h2><p>صدّر ملف بيانات JSON واحفظه في مكان آمن، واستورده عند الحاجة. الاستيراد يستبدل كل بيانات النسخة الحالية.</p><div class="actions"><button onclick="backup()">تنزيل نسخة احتياطية</button><input type="file" accept="application/json,.json" onchange="restore(event)"></div></div><div class="panel"><h2>اسم المورد الثالث</h2>${form('rename',field('name','الاسم الجديد','text',`value="${esc(db.suppliers[2])}"`))}</div>`}document.getElementById('view').innerHTML=html}
function submitData(ev,action){ev.preventDefault();let f=Object.fromEntries(new FormData(ev.target));if(action==='machine'){if(db.machines.some(m=>m.code===f.code))return alert('كود الماكينة مستخدم بالفعل');db.machines.push({...f,id:id(),cost:num(f.cost),sale:0,deal:null,delivered:false})}if(action==='supplierPayment')db.supplierPayments.push({...f,id:id(),amount:num(f.amount)});if(action==='customer'){if(db.customers.some(c=>c.name===f.name))return alert('العميل موجود');db.customers.push({...f,id:id()})}if(action==='deal'){if(!f.customer)return alert('أضف عميلًا أولًا');db.deals.push({...f,id:id()})}if(action==='assign'){let [did]=f.deal.split(' | '),[code]=f.machine.split(' | '),m=db.machines.find(m=>m.code===code);if(!m||m.deal)return alert('اختر ماكينة متاحة');m.deal=did;m.sale=num(f.sale)}if(action==='receipt'){let [did]=f.deal.split(' | '),d=db.deals.find(d=>d.id===did);if(!d||num(f.amount)<=0||dealPaid(d)+num(f.amount)>dealTotal(d))return alert('المبلغ أكبر من المتبقي أو الصفقة بلا ماكينات');db.receipts.push({...f,deal:did,id:id(),amount:num(f.amount)})}if(action==='expense')db.expenses.push({...f,id:id(),amount:num(f.amount)});if(action==='withdrawal')db.withdrawals.push({...f,id:id(),amount:num(f.amount)});if(action==='rename'){let old=db.suppliers[2];db.suppliers[2]=f.name;db.machines.forEach(m=>{if(m.supplier===old)m.supplier=f.name});db.supplierPayments.forEach(p=>{if(p.supplier===old)p.supplier=f.name});tab=f.name}save()}
function deliver(mid){let m=db.machines.find(m=>m.id===mid),d=db.deals.find(d=>d.id===m?.deal);if(!m||!d||m.delivered||availableDelivery(d)<num(m.sale))return alert('المبلغ المدفوع لا يغطي تسليم هذه الماكينة');if(confirm('تأكيد تسليم الماكينة؟')){m.delivered=true;m.deliveryDate=today();save()}}
function printDoc(body){document.getElementById('printArea').innerHTML=`<div class="invoice">${body}</div>`;window.print()}function heading(title,d){return `<div class="head"><h1>⚙ الحمد</h1><h3>لاستيراد وتجارة معدات النجارة</h3><b>م. أحمد هاني</b><p>المنصورة – دكرنس – القباب الصغرى – بجوار معرض مكة للسيراميك</p><p dir="ltr">01500070661 | 01555502800 | 01004670661</p></div><h2 style="text-align:center">${title}</h2><p>العميل: ${esc(d.customer)} &nbsp; | &nbsp; رقم الصفقة: ${esc(d.id)} &nbsp; | &nbsp; التاريخ: ${today()}</p>`}function invoice(did){let d=db.deals.find(d=>d.id===did),ms=db.machines.filter(m=>m.deal===did);printDoc(heading('فاتورة بيع',d)+table(['الماكينة','الكمية','السعر','التسليم'],ms.map(m=>tr([esc(m.name)+' — '+esc(m.code),'1',money(m.sale),m.delivered?'تم التسليم':'لم يتم التسليم'])))+`<h3>الإجمالي: ${money(dealTotal(d))} | المدفوع: ${money(dealPaid(d))} | المتبقي: ${money(dealTotal(d)-dealPaid(d))}</h3><div class="sign"><span>توقيع العميل: ..................</span><span>توقيع البائع: ..................</span></div>`)}function statement(did){let d=db.deals.find(d=>d.id===did);printDoc(heading('كشف حساب عميل',d)+table(['التاريخ','العملية','المبلغ'],[tr([esc(d.date),'إجمالي الصفقة',money(dealTotal(d))]),...db.receipts.filter(r=>r.deal===did).map(r=>tr([esc(r.date),'دفعة مستلمة',money(r.amount)]))])+`<h3>المتبقي: ${money(dealTotal(d)-dealPaid(d))}</h3>`)}function receiptPrint(did){let d=db.deals.find(d=>d.id===did),r=db.receipts.filter(r=>r.deal===did).at(-1);if(!r)return alert('لا توجد دفعات لهذه الصفقة');printDoc(heading('إيصال استلام دفعة',d)+`<h2>استلمنا مبلغ: ${money(r.amount)}</h2><p>بتاريخ: ${esc(r.date)}</p><p>إجمالي ما تم دفعه: ${money(dealPaid(d))}</p><p>المتبقي: ${money(dealTotal(d)-dealPaid(d))}</p><div class="sign"><span>توقيع العميل: ..................</span><span>توقيع المستلم: ..................</span></div>`)}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='alhamd-backup-'+today()+'.json';a.click();URL.revokeObjectURL(a.href)}async function restore(e){let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.machines)||!Array.isArray(x.suppliers)||!Array.isArray(x.deals)||!Array.isArray(x.receipts))throw Error();if(!confirm('استبدال جميع البيانات الحالية بالنسخة الاحتياطية؟'))return;db=x;tab='الرئيسية';save()}catch{alert('ملف النسخة الاحتياطية غير صالح')}}render();</script></body></html>
