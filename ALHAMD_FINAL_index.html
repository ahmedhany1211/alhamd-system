</style></head><body>
<header><div class="workshop-banner"><button class="mobile-menu" type="button" aria-label="فتح القائمة" onclick="document.body.classList.toggle('drawer-open')">☰ القائمة</button><div class="workshop-content"><div><div class="brand-lockup"><div class="brand-mark">الحمد<span>ALHAMD</span></div><div class="brand-copy"><div class="brand-eyebrow">نظام إدارة معدات النجارة</div><h1>الحمد <em>لاستيراد وتجارة معدات النجارة</em></h1><p>م. أحمد هاني</p></div></div><div class="brand-address">المنصورة – دكرنس – القباب الصغرى – بجوار معرض مكة للسيراميك</div></div><svg class="workshop-illustration" viewBox="0 0 430 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="رسومات ماكينات نجارة"><defs><linearGradient id="mach" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6dde1"/><stop offset=".5" stop-color="#728b9a"/><stop offset="1" stop-color="#253f50"/></linearGradient></defs><ellipse cx="216" cy="174" rx="210" ry="20" fill="#000" opacity=".35"/><g stroke="#e6c48b" stroke-width="2"><rect x="24" y="82" width="183" height="80" rx="8" fill="url(#mach)"/><rect x="43" y="57" width="143" height="30" rx="4" fill="#294e61"/><rect x="50" y="99" width="90" height="40" rx="4" fill="#172f42"/><circle cx="163" cy="117" r="15" fill="#d6ac65"/><rect x="30" y="160" width="17" height="18" fill="#203a4c"/><rect x="182" y="160" width="17" height="18" fill="#203a4c"/><rect x="230" y="97" width="171" height="58" rx="7" fill="url(#mach)"/><rect x="245" y="75" width="140" height="25" rx="4" fill="#26465a"/><rect x="248" y="112" width="85" height="24" rx="3" fill="#18364a"/><circle cx="365" cy="122" r="13" fill="#d6ac65"/><rect x="242" y="154" width="13" height="23" fill="#203a4c"/><rect x="381" y="154" width="13" height="23" fill="#203a4c"/></g><text x="84" y="124" font-size="14" font-family="Arial" fill="#e7bc72">SCM</text><text x="266" y="129" font-size="12" font-family="Arial" fill="#e7bc72">ALHAMD</text></svg></div></div></header>
<div class="drawer-shade" onclick="document.body.classList.remove('drawer-open')"></div><div class="workspace"><nav id="nav" aria-label="أقسام البرنامج"></nav><main><div class="workshop-note">هذه نسخة تبدأ بدون بيانات تجريبية. الحفظ على الجهاز فقط، والربط السحابي غير مفعّل. احتفظ بنسخة احتياطية من الإعدادات.</div><section id="app"></section></main></div><div id="paper"></div>
<script>
'use strict';
const STORAGE='alhamd-production-v1', EMPTY=()=>({suppliers:[],machines:[],supplierPayments:[],customers:[],deals:[],receipts:[],expenses:[],withdrawals:[],cashMoves:[],loans:[],loanMoves:[]});
let db;try{db=JSON.parse(localStorage.getItem(STORAGE))}catch(e){}if(!db||typeof db!=='object')db=EMPTY();for(const k of Object.keys(EMPTY()))if(!Array.isArray(db[k]))db[k]=[];
let tab='الرئيسية',query='';
const $=id=>document.getElementById(id), num=x=>Number(x)||0, cash=x=>num(x).toLocaleString('ar-EG',{maximumFractionDigits:2})+' ج.م', sum=(arr,fn)=>arr.reduce((a,b)=>a+num(fn(b)),0), uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,9), today=()=>{let d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')},esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])),nameOf=(list,id)=>list.find(x=>x.id===id)?.name||'—';
function persist(){try{localStorage.setItem(STORAGE,JSON.stringify(db));render()}catch(e){alert('تعذّر حفظ البيانات. صدّر نسخة احتياطية وتأكد من وجود مساحة تخزين.')}}
function field(k,l,type='text',attrs='',wide=false){return `<div class="${wide?'wide':''}"><label>${l}</label><input name="${k}" type="${type}" ${attrs} required></div>`}
function optional(k,l,type='text',attrs=''){return `<div><label>${l}</label><input name="${k}" type="${type}" ${attrs}></div>`}
function pick(k,l,arr,placeholder='اختر'){return `<div><label>${l}</label><select name="${k}" required><option value="">${placeholder}</option>${arr.map(o=>`<option value="${esc(o.id)}">${esc(o.label||o.name)}</option>`).join('')}</select></div>`}
function noteChoice(k,l,options){return `<div><label>${l}</label><select name="${k}" required>${options.map(x=>`<option value="${esc(x)}">${esc(x)}</option>`).join('')}</select></div>`}
const supplierNotes=['دفعة من الحساب','مقدم للمورد','سداد جزء من ماكينة','سداد كامل','أخرى'];
const customerNotes=['عربون','دفعة من الحساب','سداد باقي الصفقة','سداد كامل','أخرى'];
const expenseNotes=['نقل','صيانة','عمالة','شحن','تحميل وتنزيل','مصروف عام','أخرى'];
function date(){return field('date','التاريخ','date',`value="${today()}"`)}
function form(action,html){return `<form data-action="${action}">${html}<div class="wide"><button class="gold" type="submit">حفظ العملية</button></div></form>`}
function grid(items){return `<div class="grid">${items.map(([k,v])=>`<div class="metric">${k}<b>${v}</b></div>`).join('')}</div>`}
function table(headers,rows){return `<div class="scroll"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.length?rows.map(row=>{let i=0;return row.replace(/<td(\\s[^>]*)?>/g,(tag,attrs='')=>`<td${attrs} data-label="${esc(headers[i++]||'')}">`)}).join(''):`<tr><td colspan="${headers.length}" class="empty">لا توجد بيانات بعد</td></tr>`}</tbody></table></div>`}
function tr(vals){return `<tr>${vals.map(v=>`<td>${v}</td>`).join('')}</tr>`}
function btn(label,act,id,style='small'){return `<button class="${style}" data-do="${act}" data-id="${esc(id)}">${label}</button>`}
function machineCost(m){return num(m.cost)+sum(db.expenses.filter(e=>e.machineId===m.id),e=>e.amount)}
function dealMachines(d){return db.machines.filter(m=>m.dealId===d.id)}
function total(d){return sum(dealMachines(d),m=>m.sale)}
function paid(d){return sum(db.receipts.filter(r=>r.dealId===d.id),r=>r.amount)}
function deliverable(d){return paid(d)-sum(dealMachines(d).filter(m=>m.delivered),m=>m.sale)}
function loanBalance(l){return sum(db.loanMoves.filter(m=>m.loanId===l.id),m=>m.type==='give'?m.amount:-m.amount)}
function loanCash(){return sum(db.loanMoves,m=>{let l=db.loans.find(x=>x.id===m.loanId);if(!l)return 0;return (l.direction==='out'?-1:1)*(m.type==='give'?m.amount:-m.amount)})}
function supplierBalance(s){return sum(db.machines.filter(m=>m.supplierId===s.id),m=>m.cost)-sum(db.supplierPayments.filter(p=>p.supplierId===s.id),p=>p.amount)}
function nav(){const tabs=['الرئيسية','الماكينات','الموردون','العملاء والصفقات','السلف','المصاريف والخزنة','الإعدادات'];$('nav').innerHTML='<div class="sidebar-heading">القائمة الرئيسية</div>'+tabs.map((t,i)=>`<button data-tab="${t}" class="${tab===t?'active':''}"><span class="nav-symbol">${['⌂','⚙','♧','▣','⇄','◈','☷'][i]}</span><span>${t}</span></button>`).join('')}
function render(){nav();let html='';
if(tab==='الرئيسية'){
let receipts=sum(db.receipts,r=>r.amount),sp=sum(db.supplierPayments,p=>p.amount),exp=sum(db.expenses,e=>e.amount),draw=sum(db.withdrawals,w=>w.amount),moves=sum(db.cashMoves,x=>x.type==='in'?x.amount:-x.amount),sold=db.machines.filter(m=>m.dealId),stock=db.machines.filter(m=>!m.dealId);
html=`<div class="dashboard-hero"><div><span class="eyebrow">نظرة عامة على النشاط</span><h2>لوحة التحكم</h2><p>ملخص حسابات الشركة والمخزون والحركة النقدية</p></div><div class="hero-machines" aria-hidden="true"><svg viewBox="0 0 330 145" width="100%" height="100%"><defs><linearGradient id="steel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e5cf9d"/><stop offset="1" stop-color="#98733b"/></linearGradient></defs><g fill="none" stroke="url(#steel)" stroke-width="3"><rect x="20" y="42" width="125" height="70" rx="5"/><path d="M20 61h125M40 112v18m84-18v18M44 80h28m14 0h42"/><circle cx="96" cy="43" r="25"/><path d="M96 18v50M71 43h50M170 55h140v59H170zM183 55V32h111v23M187 74h103M195 114v18m98-18v18M227 76v38M259 76v38"/><circle cx="242" cy="41" r="10"/></g><g fill="#e2bd78"><circle cx="96" cy="43" r="5"/><rect x="28" y="89" width="28" height="7" rx="2"/><rect x="178" y="87" width="32" height="8" rx="2"/></g></svg></div></div><div class="card dashboard-card">${grid([['الماكينات بالمخزن',stock.length],['تكلفة الماكينات المتاحة',cash(sum(stock,m=>machineCost(m)))],['المقبوض من العملاء',cash(receipts)],['المدفوع للموردين',cash(sp)],['المتبقي على العملاء',cash(sum(db.deals,d=>total(d)-paid(d)))],['مستحق للموردين',cash(sum(db.suppliers,s=>Math.max(0,supplierBalance(s))))],['مقدمات لدى الموردين',cash(sum(db.suppliers,s=>Math.max(0,-supplierBalance(s))))],['فلوس لينا عند الغير',cash(sum(db.loans.filter(l=>l.direction==='out'),l=>Math.max(0,loanBalance(l))))],['فلوس علينا للغير',cash(sum(db.loans.filter(l=>l.direction==='in'),l=>Math.max(0,loanBalance(l))))],['المصاريف',cash(exp)],['المسحوبات الشخصية',cash(draw)],['الرصيد النقدي المسجل',cash(receipts-sp-exp-draw+moves+loanCash())],['ربح الماكينات المباعة قبل المصاريف العامة',cash(sum(sold,m=>m.sale-machineCost(m)))]])}<p class="hint">الرصيد النقدي يعتمد على الحركات المسجلة فقط. الربح تقديري ولا يشمل المصاريف العامة أو الضرائب.</p></div><div class="quick-actions"><button data-go="الماكينات">⚙ إضافة ماكينة</button><button data-go="العملاء والصفقات">▣ صفقة بيع / عميل</button><button data-go="الموردون">♧ إضافة مورد</button><button data-go="المصاريف والخزنة">◈ تسجيل مصروف</button></div>`;
}else if(tab==='الماكينات'){
html=`<div class="card"><h2>إضافة ماكينة / شحنة</h2><p class="hint">اكتب نفس رقم الشحنة لكل الماكينات التي تم شراؤها معًا.</p>${db.suppliers.length?form('machine',date()+field('name','اسم الماكينة')+field('code','كود الماكينة')+pick('supplierId','المورد',db.suppliers)+field('batch','رقم الشحنة / عملية الشراء')+field('cost','سعر الشراء','number','min="0" step="0.01"')):'<p class="hint">أضف موردًا أولًا من صفحة الموردون.</p>'}</div>
<div class="card"><div class="sectionbar"><h2>قائمة الماكينات</h2><input id="machineSearch" placeholder="بحث بالاسم أو الكود" value="${esc(query)}" style="max-width:260px"></div>${table(['الكود','الماكينة','المورد','الشحنة','تكلفة الشراء','المصاريف المرتبطة','سعر البيع','الحالة','إجراء'],db.machines.filter(m=>(m.code+' '+m.name).toLowerCase().includes(query.toLowerCase())).map(m=>tr([esc(m.code),esc(m.name),esc(nameOf(db.suppliers,m.supplierId)),esc(m.batch),cash(m.cost),cash(machineCost(m)-num(m.cost)),m.dealId?cash(m.sale):'—',m.delivered?'تم التسليم':m.dealId?'محجوزة':'متاحة',m.dealId?'—':btn('تعديل','editMachine',m.id,'light small')])) )}</div>`;
}else if(tab==='الموردون'){
html=`<div class="card"><h2>إضافة مورد</h2>${form('supplier',field('name','اسم المورد')+optional('phone','رقم الهاتف','tel'))}</div>
<div class="card"><h2>حسابات الموردين</h2>${table(['المورد','المشتريات','المدفوع والمقدم','المتبقي','إجراء'],db.suppliers.map(s=>tr([esc(s.name),cash(sum(db.machines.filter(m=>m.supplierId===s.id),m=>m.cost)),cash(sum(db.supplierPayments.filter(p=>p.supplierId===s.id),p=>p.amount)),(supplierBalance(s)<0?'<strong class="advance">مقدم لنا: '+cash(-supplierBalance(s))+'</strong>':'<strong>'+cash(supplierBalance(s))+'</strong>'),btn('تعديل الاسم','renameSupplier',s.id,'light small')+' '+btn('التفاصيل','supplierDetail',s.id,'small')])) )}</div>
<div class="card"><h2>تسجيل دفعة أو مقدم لمورد</h2>${db.suppliers.length?form('supplierPayment',date()+pick('supplierId','المورد',db.suppliers)+field('amount','المبلغ','number','min="0.01" step="0.01"')+noteChoice('note','البيان',supplierNotes)):'<p class="hint">أضف موردًا أولًا.</p>'}</div>
<div class="card"><h2>سجل مدفوعات الموردين</h2>${table(['التاريخ','المورد','البيان','المبلغ','إجراء'],db.supplierPayments.map(p=>tr([esc(p.date),esc(nameOf(db.suppliers,p.supplierId)),esc(p.note),cash(p.amount),btn('تعديل','editSupplierPayment',p.id,'light small')+' '+btn('إلغاء','deleteSupplierPayment',p.id,'red small')])))}</div>`;
}else if(tab==='العملاء والصفقات'){
html=`<div class="card"><h2>إضافة عميل</h2>${form('customer',field('name','اسم العميل')+optional('phone','رقم الهاتف','tel'))}</div>
<div class="card"><h2>إنشاء صفقة بيع</h2>${db.customers.length?form('deal',date()+pick('customerId','العميل',db.customers)+noteChoice('note','البيان',['بيع ماكينة','بيع عدة ماكينات','حجز ماكينة','أخرى'])):'<p class="hint">أضف عميلًا أولًا.</p>'}</div>
<div class="card"><h2>إضافة ماكينة لصفقة</h2>${db.deals.length&&db.machines.some(m=>!m.dealId)?form('assign',pick('dealId','الصفقة',db.deals.map(d=>({id:d.id,name:d.code+' — '+nameOf(db.customers,d.customerId)})))+pick('machineId','الماكينة المتاحة',db.machines.filter(m=>!m.dealId).map(m=>({id:m.id,name:m.code+' — '+m.name})))+field('sale','سعر البيع','number','min="0.01" step="0.01"')):'<p class="hint">يلزم وجود صفقة وماكينة متاحة.</p>'}</div>
<div class="card"><h2>تسجيل قسط / دفعة عميل</h2>${db.deals.some(d=>total(d)>paid(d))?form('receipt',date()+pick('dealId','الصفقة',db.deals.filter(d=>total(d)>paid(d)).map(d=>({id:d.id,name:d.code+' — '+nameOf(db.customers,d.customerId)})))+field('amount','المبلغ','number','min="0.01" step="0.01"')+noteChoice('note','البيان',customerNotes)):'<p class="hint">لا توجد صفقات بمبالغ مستحقة.</p>'}</div>
<div class="card"><h2>العملاء</h2>${table(['العميل','الهاتف','الصفقات','المتبقي','إجراء'],db.customers.map(c=>{let ds=db.deals.filter(d=>d.customerId===c.id);return tr([esc(c.name),esc(c.phone),ds.length,cash(sum(ds,d=>total(d)-paid(d))),btn('تعديل','editCustomer',c.id,'light small')])}))}</div>
<div class="card"><h2>الصفقات والفواتير والتسليم</h2>${db.deals.length?db.deals.map(d=>`<div class="card" style="border:1px solid var(--line)"><h3>${esc(d.code)} — ${esc(nameOf(db.customers,d.customerId))}</h3>${grid([['إجمالي الصفقة',cash(total(d))],['المدفوع',cash(paid(d))],['المتبقي',cash(total(d)-paid(d))],['متاح للتسليم',cash(deliverable(d))]])}<div class="actions" style="margin:12px 0">${btn('فاتورة','invoice',d.id)}${btn('كشف حساب','statement',d.id)}${btn('آخر إيصال','receiptPrint',d.id)}</div>${table(['الماكينة','سعر البيع','التسليم','إجراء'],dealMachines(d).map(m=>tr([esc(m.code+' — '+m.name),cash(m.sale),m.delivered?'تم التسليم':'لم تسلم',m.delivered?'—':btn('تسليم','deliver',m.id,'gold small')])) )}</div>`).join(''):'<p class="hint">لا توجد صفقات بعد.</p>'}</div>`;
}else if(tab==='السلف'){
 html=`<div class="card"><h2>السلف والفلوس عند الغير</h2><p class="hint">سجل أي شخص باسمه، سواء كان عميلًا أو موردًا أو غير ذلك. السلف لا تدخل في المبيعات أو الأرباح أو المصاريف.</p>${form('loanPerson',field('name','اسم الشخص')+pick('direction','نوع الحساب',[{id:'out',name:'فلوس لينا عند الشخص'},{id:'in',name:'فلوس علينا للشخص'}]))}</div>
 <div class="card"><h2>تسجيل سلفة أو سداد</h2>${db.loans.length?form('loanMove',date()+pick('loanId','الشخص',db.loans.map(l=>({id:l.id,name:l.name+' — '+(l.direction==='out'?'لينا عنده':'علينا ليه')})))+pick('type','نوع العملية',[{id:'give',name:'سلفة جديدة / استلام سلفة'},{id:'return',name:'سداد جزء أو كامل'}])+field('amount','المبلغ','number','min="0.01" step="0.01"')+noteChoice('note','البيان',['سلفة','دفعة من الحساب','سداد جزئي','سداد كامل','أخرى'])):'<p class="hint">سجل اسم شخص أولًا.</p>'}</div>
 <div class="card"><h2>حسابات السلف</h2>${table(['الاسم','نوع الحساب','الرصيد','إجراء'],db.loans.map(l=>tr([esc(l.name),l.direction==='out'?'فلوس لينا':'فلوس علينا',cash(loanBalance(l)),btn('تعديل الاسم','editLoanPerson',l.id,'light small')])) )}</div>
 <div class="card"><h2>حركات السلف والسداد</h2>${table(['التاريخ','الشخص','العملية','البيان','المبلغ','إجراء'],db.loanMoves.map(m=>tr([esc(m.date),esc(nameOf(db.loans,m.loanId)),m.type==='give'?'سلفة':'سداد',esc(m.note),cash(m.amount),btn('تعديل','editLoanMove',m.id,'light small')+' '+btn('إلغاء','deleteLoanMove',m.id,'red small')])) )}</div>`;
 }else if(tab==='المصاريف والخزنة'){
html=`<div class="card"><h2>إضافة مصروف</h2>${form('expense',date()+noteChoice('note','البيان',expenseNotes)+field('amount','المبلغ','number','min="0.01" step="0.01"')+`<div><label>الماكينة (اختياري)</label><select name="machineId"><option value="">مصروف عام</option>${db.machines.map(m=>`<option value="${esc(m.id)}">${esc(m.code+' — '+m.name)}</option>`).join('')}</select></div>`)}</div>
<div class="card"><h2>مسحوبات شخصية / البيت</h2>${form('withdrawal',date()+field('note','البيان')+field('amount','المبلغ','number','min="0.01" step="0.01"'))}</div>
<div class="card"><h2>رصيد افتتاحي / تمويل / حركة خزنة</h2>${form('cashMove',date()+pick('type','نوع الحركة',[{id:'in',name:'إضافة نقدية / رصيد افتتاحي'},{id:'out',name:'صرف نقدي آخر'}])+field('amount','المبلغ','number','min="0.01" step="0.01"')+field('note','البيان'))}</div>
<div class="card"><h2>سجل المصاريف</h2>${table(['التاريخ','البيان','الماكينة','المبلغ'],db.expenses.map(e=>tr([esc(e.date),esc(e.note),esc(db.machines.find(m=>m.id===e.machineId)?.code||'عام'),cash(e.amount)])))}</div>
<div class="card"><h2>سجل المسحوبات</h2>${table(['التاريخ','البيان','المبلغ'],db.withdrawals.map(e=>tr([esc(e.date),esc(e.note),cash(e.amount)])))}</div>
<div class="card"><h2>حركات الخزنة الأخرى</h2>${table(['التاريخ','البيان','نوع الحركة','المبلغ'],db.cashMoves.map(e=>tr([esc(e.date),esc(e.note),e.type==='in'?'إضافة':'خصم',cash(e.amount)])))}</div>`;
}else{
html=`<div class="card"><h2>النسخ الاحتياطي</h2><p class="hint">احفظ نسخة JSON خارج المتصفح بانتظام. الاستيراد يستبدل بيانات البرنامج الحالية بعد التأكيد.</p><div class="actions"><button data-do="backup">تنزيل نسخة احتياطية</button><label style="max-width:300px">استيراد نسخة<input id="restoreFile" type="file" accept=".json,application/json"></label></div></div><div class="card"><h2>حالة الحفظ</h2><p>الحفظ المحلي: <b>مفعّل على هذا المتصفح</b></p><p>المزامنة السحابية: <b>غير مفعّلة</b></p><p class="hint">النسخة الحالية لا ترسل أي بيانات إلى Supabase. تفعيل المزامنة الآمنة يحتاج ربط تسجيل الدخول والتحقق من صلاحيات الجداول.</p></div>`;
}
$('app').innerHTML=html}
function validMoney(f){return Number.isFinite(Number(f.amount))&&Number(f.amount)>0}
function submit(action,f){if(action==='supplier'){if(db.suppliers.some(s=>s.name===f.name.trim()))return alert('المورد موجود بالفعل');db.suppliers.push({id:uid(),name:f.name.trim(),phone:f.phone||''})}
else if(action==='machine'){if(!db.suppliers.some(s=>s.id===f.supplierId))return alert('اختر موردًا');if(db.machines.some(m=>m.code.trim().toLowerCase()===f.code.trim().toLowerCase()))return alert('كود الماكينة موجود بالفعل');db.machines.push({...f,id:uid(),code:f.code.trim(),name:f.name.trim(),cost:num(f.cost),sale:0,dealId:null,delivered:false})}
else if(action==='supplierPayment'){if(!validMoney(f))return alert('أدخل مبلغًا صحيحًا');db.supplierPayments.push({...f,id:uid(),amount:num(f.amount)})}
else if(action==='loanPerson'){if(!f.name.trim())return alert('اكتب اسم الشخص');db.loans.push({id:uid(),name:f.name.trim(),direction:f.direction})}
 else if(action==='loanMove'){if(!db.loans.some(l=>l.id===f.loanId)||!validMoney(f))return alert('راجع البيانات');if(f.type==='return'&&num(f.amount)>loanBalance(db.loans.find(l=>l.id===f.loanId))+.00001)return alert('السداد أكبر من الرصيد');db.loanMoves.push({...f,id:uid(),amount:num(f.amount)})}
 else if(action==='customer'){if(db.customers.some(c=>c.name===f.name.trim()))return alert('العميل موجود بالفعل');db.customers.push({id:uid(),code:'C'+String(db.customers.length+1).padStart(3,'0'),name:f.name.trim(),phone:f.phone||''})}
else if(action==='deal'){if(!db.customers.some(c=>c.id===f.customerId))return alert('اختر عميلًا');db.deals.push({...f,id:uid(),code:'S'+String(db.deals.length+1).padStart(3,'0')})}
else if(action==='assign'){let m=db.machines.find(m=>m.id===f.machineId),d=db.deals.find(d=>d.id===f.dealId);if(!m||m.dealId||!d||num(f.sale)<=0)return alert('تأكد من الصفقة والماكينة والسعر');m.dealId=d.id;m.sale=num(f.sale)}
else if(action==='receipt'){let d=db.deals.find(d=>d.id===f.dealId);if(!d||!validMoney(f)||num(f.amount)>total(d)-paid(d)+.00001)return alert('الدفعة أكبر من المتبقي أو غير صحيحة');db.receipts.push({...f,id:uid(),amount:num(f.amount)})}
else if(['expense','withdrawal','cashMove'].includes(action)){if(!validMoney(f))return alert('أدخل مبلغًا صحيحًا');db[action==='expense'?'expenses':action==='withdrawal'?'withdrawals':'cashMoves'].push({...f,id:uid(),amount:num(f.amount)})}
persist()}
document.addEventListener('submit',e=>{let form=e.target.closest('form[data-action]');if(!form)return;e.preventDefault();submit(form.dataset.action,Object.fromEntries(new FormData(form)))});
$('nav').addEventListener('click',e=>{let b=e.target.closest('[data-tab]');if(b){tab=b.dataset.tab;query='';document.body.classList.remove('drawer-open');render();window.scrollTo(0,0)}});
$('app').addEventListener('click',e=>{let b=e.target.closest('[data-go]');if(b){tab=b.dataset.go;query='';render();window.scrollTo(0,0)}});
$('app').addEventListener('input',e=>{if(e.target.id==='machineSearch'){query=e.target.value;let start=e.target.selectionStart;render();let el=$('machineSearch');el.focus();el.setSelectionRange(start,start)}});
$('app').addEventListener('change',async e=>{if(e.target.id!=='restoreFile')return;let f=e.target.files[0];if(!f)return;try{let x=JSON.parse(await f.text());if(!x||!Array.isArray(x.suppliers)||!Array.isArray(x.machines)||!Array.isArray(x.deals))throw Error();if(!confirm('استبدال جميع بيانات البرنامج الحالية بالنسخة المستوردة؟'))return;db=x;for(let k of Object.keys(EMPTY()))if(!Array.isArray(db[k]))db[k]=[];tab='الرئيسية';persist()}catch(err){alert('ملف النسخة الاحتياطية غير صالح')}});
$('app').addEventListener('click',e=>{let b=e.target.closest('[data-do]');if(!b)return;let a=b.dataset.do,id=b.dataset.id;
if(a==='backup'){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='alhamd-backup-'+today()+'.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}
if(a==='renameSupplier'){let s=db.suppliers.find(x=>x.id===id);if(!s)return;let n=prompt('اسم المورد الجديد',s.name);if(n===null)return;n=n.trim();if(!n||db.suppliers.some(x=>x.id!==id&&x.name===n))return alert('الاسم غير صحيح أو مكرر');s.name=n;persist()}
if(a==='editSupplierPayment'||a==='editLoanMove'){
 let arr=a==='editSupplierPayment'?db.supplierPayments:db.loanMoves,rec=arr.find(x=>x.id===id);if(!rec)return;
 let v=prompt('المبلغ الصحيح',rec.amount);if(v===null)return;
 if(!Number.isFinite(Number(v))||num(v)<=0)return alert('المبلغ غير صحيح');
 if(a==='editLoanMove'&&rec.type==='return'){let l=db.loans.find(x=>x.id===rec.loanId);if(num(v)>loanBalance(l)+num(rec.amount)+.00001)return alert('السداد أكبر من الرصيد')}
 rec.amount=num(v);persist();
 }
 if(a==='deleteSupplierPayment'||a==='deleteLoanMove'){
 if(!confirm('تأكيد إلغاء هذه الحركة؟ سيتم تحديث الرصيد والخزنة تلقائيًا'))return;
 let arr=a==='deleteSupplierPayment'?db.supplierPayments:db.loanMoves;
 let i=arr.findIndex(x=>x.id===id);if(i<0)return;
 if(a==='deleteLoanMove'&&arr[i].type==='give'){let l=db.loans.find(x=>x.id===arr[i].loanId);if(loanBalance(l)-num(arr[i].amount)<-.00001)return alert('لا يمكن حذف السلفة قبل تعديل السداد المرتبط بها')}
 arr.splice(i,1);persist();
 }
 if(a==='editLoanPerson'){let l=db.loans.find(x=>x.id===id);if(!l)return;let n=prompt('اسم الشخص',l.name);if(n===null)return;if(!n.trim())return alert('الاسم مطلوب');l.name=n.trim();persist()}
 if(a==='editCustomer'){let c=db.customers.find(x=>x.id===id);if(!c)return;let n=prompt('اسم العميل',c.name);if(n===null)return;if(!n.trim())return alert('الاسم مطلوب');c.name=n.trim();let p=prompt('رقم الهاتف',c.phone||'');if(p!==null)c.phone=p;persist()}
if(a==='editMachine'){let m=db.machines.find(x=>x.id===id);if(!m||m.dealId)return;let n=prompt('اسم الماكينة',m.name);if(n===null)return;if(!n.trim())return alert('الاسم مطلوب');m.name=n.trim();let c=prompt('كود الماكينة',m.code);if(c===null)return;if(!c.trim()||db.machines.some(x=>x.id!==id&&x.code===c.trim()))return alert('الكود غير صحيح أو مكرر');m.code=c.trim();persist()}
if(a==='supplierDetail'){let s=db.suppliers.find(x=>x.id===id);if(!s)return;let machines=db.machines.filter(m=>m.supplierId===id),groups={};machines.forEach(m=>{let key=m.batch||'غير محدد';if(!groups[key])groups[key]={total:0,count:0};groups[key].total+=num(m.cost);groups[key].count++});let lines=Object.entries(groups).map(([k,v])=>k+': '+v.count+' ماكينة — '+cash(v.total));alert('المورد: '+s.name+'\nالمشتريات:\n'+(lines.join('\n')||'لا توجد مشتريات')+'\nالمدفوع: '+cash(sum(db.supplierPayments.filter(p=>p.supplierId===id),p=>p.amount))+'\nالمتبقي: '+cash(supplierBalance(s)))}
if(a==='deliver'){let m=db.machines.find(x=>x.id===id),d=db.deals.find(x=>x.id===m?.dealId);if(!m||!d||m.delivered)return;if(deliverable(d)+.00001<num(m.sale))return alert('لا يمكن التسليم: المدفوع لا يغطي سعر الماكينة بعد خصم ما تم تسليمه');if(confirm('تأكيد تسليم '+m.name+'؟')){m.delivered=true;m.deliveryDate=today();persist()}}
if(['invoice','statement','receiptPrint'].includes(a))printDocument(a,id);
});
function head(title,d){let c=db.customers.find(x=>x.id===d.customerId);return `<div class="bill-top"><div class="bill-brand"><div class="bill-emblem">⚙</div><div><div class="bill-company">الحمد</div><div class="bill-subtitle">للاستيراد وتجارة معدات النجارة</div><div class="bill-en">ALHAMD · WOODWORKING MACHINERY</div></div></div><div class="bill-contact"><div>☎ 01500070661</div><div>☎ 01555502800</div><div>☎ 01004670661</div><small>المنصورة – دكرنس – القباب الصغرى<br>بجوار معرض مكة للسيراميك</small></div></div><div class="bill-title"><span>${title}</span><small>${title==='فاتورة بيع'?'SALES INVOICE':title==='كشف حساب'?'ACCOUNT STATEMENT':'PAYMENT RECEIPT'}</small></div><div class="bill-meta"><div><small>رقم الفاتورة</small><strong>INV-${esc(d.code)}</strong></div><div><small>التاريخ</small><strong>${esc(d.date||today())}</strong></div></div><div class="bill-info"><div><h3>بيانات العميل</h3><p>اسم العميل <b>${esc(c?.name||'—')}</b></p><p>كود العميل <b>${esc(c?.code||c?.id?.slice(-6).toUpperCase()||'—')}</b></p><p>الهاتف <b>${esc(c?.phone||'—')}</b></p><p>العنوان <b>${esc(c?.address||'—')}</b></p></div><div><h3>بيانات الصفقة</h3><p>رقم الصفقة <b>${esc(d.code)}</b></p><p>الحالة <b>${dealMachines(d).every(m=>m.delivered)?'تم التسليم':'جاري التنفيذ / التسليم'}</b></p><p>طريقة الدفع <b>${paid(d)>=total(d)?'مدفوعة بالكامل':'دفعات / أقساط'}</b></p></div></div>`}
function printDocument(type,id){let d=db.deals.find(d=>d.id===id);if(!d)return;let html=head(type==='invoice'?'فاتورة بيع':type==='statement'?'كشف حساب':'إيصال استلام دفعة',d);
if(type==='invoice'){html+=`<div class="bill-items">`+table(['م','كود الماكينة','اسم الماكينة','الكمية','سعر الوحدة','الإجمالي'],dealMachines(d).map((m,i)=>tr([i+1,esc(m.code),esc(m.name),'1',cash(m.sale),cash(m.sale)])))+`</div><div class="bill-lower"><div class="bill-notes"><h3>ملاحظات</h3><p>• يتم إثبات تسليم الماكينات حسب حالة الصفقة المسجلة.</p><p>• يُرجى الاحتفاظ بالفاتورة للرجوع إليها.</p><p>• هذه الفاتورة صادرة من شركة الحمد.</p></div><div class="bill-totals"><p>إجمالي الفاتورة <b>${cash(total(d))}</b></p><p>المدفوع <b>${cash(paid(d))}</b></p><p class="bill-due">المتبقي <b>${cash(total(d)-paid(d))}</b></p></div></div>`}
if(type==='statement')html+=table(['التاريخ','العملية','المبلغ'],[tr([esc(d.date),'إجمالي الصفقة',cash(total(d))]),...db.receipts.filter(r=>r.dealId===d.id).map(r=>tr([esc(r.date),esc(r.note||'دفعة'),cash(r.amount)]))])+`<h3>المتبقي: ${cash(total(d)-paid(d))}</h3>`;
if(type==='receiptPrint'){let r=db.receipts.filter(r=>r.dealId===d.id).at(-1);if(!r)return alert('لا توجد دفعات للصفقة');html+=`<h2>استلمنا مبلغ: ${cash(r.amount)}</h2><p>بتاريخ: ${esc(r.date)}</p><p>إجمالي المدفوع: ${cash(paid(d))} — المتبقي: ${cash(total(d)-paid(d))}</p>`}
if(type==='invoice')html+=`<div class="bill-brands"><strong>براندات عالمية نثق بها</strong><div class="bill-brand-grid">${['SCM','BIESSE','HOMAG','ALTENDORF','FELDER','WEINIG','HOLZ-HER','FORMAT 4','SICAR','MAGGI','IMA','VITAP','Brandt','CEHISA','CASADEI','griggio','OMAL','Giben'].map(x=>'<span>'+x+'</span>').join('')}</div></div>`;
html+=`<div class="bill-signatures"><div>توقيع العميل<div class="bill-line"></div></div><div class="bill-stamp">ختم الشركة<br><small>مكان الختم</small></div><div>توقيع الشركة<div class="bill-line"></div></div></div><div class="bill-footer">الحمد لاستيراد وتجارة معدات النجارة <span>ثقتكم أساس نجاحنا</span></div>`;
$('paper').innerHTML=`<div class="invoice bill">${html}</div>`;window.print()}

try{render()}catch(err){console.error(err);document.getElementById('app').innerHTML='<div class="card"><h2>تعذر عرض الصفحة</h2><p>حدث خطأ أثناء تحميل الواجهة. بياناتك المحلية لم يتم حذفها. جرّب تحديث الصفحة.</p></div>'}
</script></body></html>
